[package]
name = "dd-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dd-client"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dd-client-core = { path = "../dd-client-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

