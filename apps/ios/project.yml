name: DevOpsDefender
options:
  bundleIdPrefix: com.devopsdefender
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
targets:
  DevOpsDefender:
    type: application
    platform: iOS
    sources:
      - DevOpsDefender
    preBuildScripts:
      - name: Build Rust FFI
        script: Scripts/build-rust.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devopsdefender.client
        PRODUCT_NAME: DevOpsDefender
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: DevOpsDefender/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: DevOpsDefender/DDClientFFI.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(TARGET_TEMP_DIR)/rust"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ldd_client_ffi"
          - "-framework"
          - "Security"
